name: Validate and build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate, test, fixture-build and check links
        run: node tools/release-build.mjs fixture
      # CI-only tooling. No production dependency, lockfile or TMDB token needed.
      - name: Install pinned browser test tooling
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
      - name: Install Chromium and Linux dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run browser smoke checks
        run: node tests/browser-smoke.mjs
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-smoke-${{ github.run_id }}
          path: test-artifacts/browser/
          if-no-files-found: warn
          retention-days: 7
